{{- if eq "true" (include "copia.cloudsql.appRole.enabled" .) }}
{{- $_ := include "copia.cloudsql.validate" . }}
{{- $copiaGrant := "" }}
{{- if and .Values.cloudsql .Values.cloudsql.appRole .Values.cloudsql.appRole.grantSql }}
{{- $copiaGrant = .Values.cloudsql.appRole.grantSql }}
{{- else }}
{{- $copiaGrant = include "copia.rds.appRole.defaultGrantSql" (include "copia.database.name" .) }}
{{- end }}
{{- include "copia.cloudsql.appRole.resources" (dict
  "root" .
  "instanceName" (include "copia.cloudsql.instanceName" .)
  "databaseName" (include "copia.database.name" .)
  "secretName" (include "copia.cloudsql.appCredentialsSecretName" .)
  "connectionSecretName" (include "copia.cloudsql.connectionSecretName" .)
  "adminSecretName" (include "copia.cloudsql.adminCredentialsSecretName" .)
  "grantSql" $copiaGrant
  "labels" (include "app.labels" .)
) }}
{{- if eq "true" (include "copia.cloudsql.conversionManager.enabled" .) }}
{{- $cmGrant := "" }}
{{- if and .Values.cloudsql .Values.cloudsql.conversionManager .Values.cloudsql.conversionManager.grantSql }}
{{- $cmGrant = .Values.cloudsql.conversionManager.grantSql }}
{{- else if and .Values.cloudsql .Values.cloudsql.appRole .Values.cloudsql.appRole.conversionManagerGrantSql }}
{{- $cmGrant = .Values.cloudsql.appRole.conversionManagerGrantSql }}
{{- else }}
{{- $cmGrant = include "copia.rds.appRole.defaultGrantSql" (include "copia.cnpg.conversionManager.database" .) }}
{{- end }}

{{- include "copia.cloudsql.appRole.resources" (dict
  "root" .
  "instanceName" (include "copia.cloudsql.conversionManager.instanceName" .)
  "databaseName" (include "copia.cnpg.conversionManager.database" .)
  "secretName" (include "copia.cloudsql.conversionManager.appCredentialsSecretName" .)
  "connectionSecretName" (include "copia.cloudsql.conversionManager.connectionSecretName" .)
  "adminSecretName" (include "copia.cloudsql.conversionManager.adminCredentialsSecretName" .)
  "grantSql" $cmGrant
  "labels" (include "app.conversion-manager.labels" .)
) }}
{{- end }}
{{- end }}
