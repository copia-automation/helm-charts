{{- define "troubleshoot.collectors.shared" -}}
- clusterInfo: {}
- clusterResources: {}

{{- $managed := eq "true" (include "copia.database.managed" .) }}
{{- if and .Values.copia .Values.copia.config .Values.copia.config.database (not $managed) }}
{{- $user := .Values.copia.config.database.USER }}
{{- $passwd := .Values.copia.config.database.PASSWD }}
{{- $host := include "copia.database.host" . }}
{{- $port := include "copia.database.port" . }}
{{- $name := .Values.copia.config.database.NAME }}
- postgres:
    collectorName: postgresql
    uri: "postgresql://{{ $user }}:{{ $passwd }}@{{ $host }}:{{ $port }}/{{ $name }}"
{{- end -}}

{{- end -}}

{{- define "troubleshoot.analyzers.shared" -}}

{{- if .Values.persistence -}}
{{- if eq $.Values.persistence.enabled true -}}
- storageClass:
    checkName: Required storage classes
    storageClassName: {{ .Values.persistence.storageClass | quote }}
    outcomes:
      - fail:
          message: The required storage class was not found in the cluster.
      - pass:
          message: The required storage class was found in the cluster.
{{- end -}}
{{- end -}}

{{- $cnpg := eq "true" (include "copia.cnpg.enabled" .) }}
{{- $rds := eq "true" (include "copia.rds.enabled" .) }}
{{- $cloudsql := eq "true" (include "copia.cloudsql.enabled" .) }}
{{- if $cnpg }}
- customResourceDefinition:
    checkName: CloudNativePG Cluster CRD
    customResourceDefinitionName: clusters.postgresql.cnpg.io
    outcomes:
      - fail:
          message: CloudNativePG CRDs are not installed. Install the operator before enabling cloudnativePG.
      - pass:
          message: CloudNativePG Cluster CRD is installed
{{- else if $rds }}
- customResourceDefinition:
    checkName: Crossplane AWS RDS Instance CRD
    customResourceDefinitionName: instances.rds.aws.upbound.io
    outcomes:
      - fail:
          message: RDS Instance CRDs are not installed. Set database.postgres.driver=rds first.
      - pass:
          message: Crossplane AWS RDS Instance CRD is installed
{{- else if $cloudsql }}
- customResourceDefinition:
    checkName: Crossplane GCP Cloud SQL DatabaseInstance CRD
    customResourceDefinitionName: databaseinstances.sql.gcp.upbound.io
    outcomes:
      - fail:
          message: Cloud SQL CRDs are not installed. Install provider-gcp-sql first.
      - pass:
          message: Crossplane GCP Cloud SQL DatabaseInstance CRD is installed
{{- else if and .Values.copia .Values.copia.config .Values.copia.config.database }}
- postgres:
    checkName: Test Database Connection
    collectorName: postgresql
    outcomes:
      - fail:
          when: connected == false
          message: Cannot connect to PostgreSQL server.
      - pass:
          message: The PostgreSQL server is accessible.
{{- end -}}

{{- if .Values.ingress -}}
{{- if eq $.Values.ingress.enabled true -}}
{{ if .Values.ingress.ingressClassName }}
- clusterResource:
    checkName: check-ingress-class
    kind: IngressClass
    name: {{ .Values.ingress.ingressClassName | quote }}
    yamlPath: "spec.controller"
    regex: .*
    outcomes:
      - fail:
          when: "false"
          message: Defined Ingress Class is not present
      - pass:
          when: "true"
          message: Defined Ingress Class is available
{{- end -}}
{{- end -}}
{{- end -}}

{{- end -}}
