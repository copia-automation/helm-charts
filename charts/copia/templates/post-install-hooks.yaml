{{- if and .Values.adminUser .Values.adminUser.create }}
{{- $xpOn := eq "true" (include "copia.crossplane.enabled" .) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-admin-bootstrap-script
  labels: {{- include "app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu
    apk add --no-cache argon2 >/dev/null

    {{- if $xpOn }}
    SECRET=/etc/db-secret
    read_secret() {
      for key in "$@"; do
        if [ -e "${SECRET}/${key}" ]; then
          tr -d '\n' < "${SECRET}/${key}"
          return 0
        fi
      done
      return 1
    }
    host="$(read_secret host endpoint address || true)"
    host="${host%%:*}"
    port="$(read_secret port || echo 5432)"
    user="$(read_secret user username || true)"
    pass="$(read_secret password attribute.password || true)"
    db="$(read_secret dbname database || echo {{ include "copia.database.name" . | quote }})"
    export PGHOST="$host" PGPORT="$port" PGUSER="$user" PGPASSWORD="$pass" PGDATABASE="$db"
    {{- $sslMode := "require" }}
    {{- if and .Values.copia.config.database .Values.copia.config.database.SSL_MODE }}
    {{- $sslMode = .Values.copia.config.database.SSL_MODE }}
    {{- end }}
    export PGSSLMODE={{ $sslMode | quote }}
    {{- end }}

    {{- if $xpOn }}
    max_attempts=450
    {{- else }}
    max_attempts=180
    {{- end }}
    attempt=0
    until pg_isready -h "$PGHOST" -p "${PGPORT:-5432}" -U "$PGUSER" -d "$PGDATABASE" -t 2; do
      attempt=$((attempt + 1))
      [ "$attempt" -ge "$max_attempts" ] && echo "postgres readiness timeout" && exit 1
      echo "waiting for postgres..."; sleep 2
    done

    attempt=0
    until psql -tAc "SELECT 1 FROM information_schema.tables WHERE table_name='user'" | grep -q 1; do
      attempt=$((attempt + 1))
      [ "$attempt" -ge "$max_attempts" ] && echo "gitea schema timeout" && exit 1
      echo "waiting for gitea schema..."; sleep 2
    done

    EXISTING=$(psql -tAc "SELECT COUNT(*) FROM \"user\" WHERE is_admin = true")
    if [ "$EXISTING" -gt 0 ]; then
      echo "admin already exists, skipping"; exit 0
    fi

    SALT=$(head -c 10 /dev/urandom | base64 | tr -d '/+=' | head -c 10)
    HASH=$(printf '%s' "$ADMIN_PASSWORD" | argon2 "$SALT" -id -t 2 -m 16 -p 8 -l 50 | awk '/Hash:/ {print $2}')
    AVATAR=$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 64)

    psql \
      -v ON_ERROR_STOP=1 \
      -v admin_username="$ADMIN_USERNAME" \
      -v admin_email="$ADMIN_EMAIL" \
      -v hash="$HASH" \
      -v salt="$SALT" \
      -v avatar="$AVATAR" <<'SQL'
    INSERT INTO "user" (
      lower_name, name, full_name, email, passwd, passwd_hash_algo,
      type, salt, is_admin, is_active, must_change_password,
      created_unix, updated_unix, last_login_unix,
      email_notifications_preference, avatar, avatar_email
    ) VALUES (
      lower(:'admin_username'), :'admin_username', :'admin_username',
      :'admin_email', :'hash', 'argon2',
      0, :'salt', true, true, true,
      extract(epoch from now())::bigint, extract(epoch from now())::bigint, 0,
      'enabled', :'avatar', :'admin_email'
    );
    SQL

    echo "admin user $ADMIN_USERNAME created"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.fullname" . }}-admin-bootstrap
  labels: {{- include "app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  # Crossplane path: kubelet blocks on Secret mount until RDS is ready (5–15m),
  # then readiness + schema waits. Non-Crossplane path stays at 20m.
  activeDeadlineSeconds: {{ if $xpOn }}3600{{ else }}1200{{ end }}
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: postgres:15-alpine
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            {{- if not $xpOn }}
            - name: PGHOST
              value: {{ include "copia.database.host" . | quote }}
            - name: PGPORT
              value: {{ include "copia.database.port" . | quote }}
            - name: PGUSER
              value: {{ include "copia.database.user" . | quote }}
            - name: PGDATABASE
              value: {{ include "copia.database.name" . | quote }}
            - name: PGPASSWORD
              value: {{ .Values.copia.config.database.PASSWD | quote }}
            {{- end }}
            - name: ADMIN_USERNAME
              value: {{ .Values.adminUser.username | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.adminUser.email | quote }}
            - name: ADMIN_PASSWORD
              value: {{ .Values.adminUser.password | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
            {{- if $xpOn }}
            - name: db-secret
              mountPath: /etc/db-secret
              readOnly: true
            {{- end }}
      volumes:
        - name: script
          configMap:
            name: {{ include "app.fullname" . }}-admin-bootstrap-script
            defaultMode: 0755
        {{- if $xpOn }}
        - name: db-secret
          secret:
            secretName: {{ include "copia.crossplane.connectionSecretName" . }}
        {{- end }}
{{- end }}
