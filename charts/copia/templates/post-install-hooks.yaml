{{- if and .Values.adminUser .Values.adminUser.create }}
{{- $generate := false }}
{{- if .Values.adminUser.generatePassword }}
{{- $generate = true }}
{{- end }}
{{- $password := .Values.adminUser.password | default "" | toString }}
{{- $secretCfg := .Values.adminUser.passwordSecret | default dict }}
{{- $writeSecret := false }}
{{- if $secretCfg.enabled }}
{{- $writeSecret = true }}
{{- end }}
{{- if and $generate (ne $password "") }}
{{- fail "adminUser.generatePassword cannot be combined with adminUser.password" }}
{{- end }}
{{- if and (not $generate) (eq $password "") }}
{{- fail "adminUser.create requires adminUser.password or adminUser.generatePassword" }}
{{- end }}
{{- if and $generate (not $writeSecret) }}
{{- fail "adminUser.generatePassword requires adminUser.passwordSecret.enabled" }}
{{- end }}
{{- $rdsOn := eq "true" (include "copia.rds.enabled" .) }}
{{- $hookPolicy := "before-hook-creation,hook-succeeded,hook-failed" }}
{{- $secretName := include "copia.admin.passwordSecretName" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-admin-bootstrap-script
  labels: {{- include "app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": {{ $hookPolicy | quote }}
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu
    apk add --no-cache argon2 >/dev/null
    {{- if $writeSecret }}
    apk add --no-cache ca-certificates kubectl >/dev/null
    {{- end }}

    {{- if $rdsOn }}
    CONN=/etc/db-connection
    APP=/etc/app-credentials
    read_file() {
      dir="$1"; shift
      for key in "$@"; do
        if [ -e "${dir}/${key}" ]; then
          tr -d '\n' < "${dir}/${key}"
          return 0
        fi
      done
      return 1
    }
    host="$(read_file "$CONN" host endpoint address || true)"
    host="${host%%:*}"
    port="$(read_file "$CONN" port || echo 5432)"
    user="$(read_file "$APP" username user || true)"
    pass="$(read_file "$APP" password || true)"
    db={{ include "copia.database.name" . | quote }}
    export PGHOST="$host" PGPORT="$port" PGUSER="$user" PGPASSWORD="$pass" PGDATABASE="$db"
    {{- $sslMode := "require" }}
    {{- if and .Values.copia.config.database .Values.copia.config.database.SSL_MODE }}
    {{- $sslMode = .Values.copia.config.database.SSL_MODE }}
    {{- end }}
    export PGSSLMODE={{ $sslMode | quote }}
    {{- end }}

    {{- if $rdsOn }}
    max_attempts=450
    {{- else }}
    max_attempts=180
    {{- end }}
    attempt=0
    until pg_isready -h "$PGHOST" -p "${PGPORT:-5432}" -U "$PGUSER" -d "$PGDATABASE" -t 2; do
      attempt=$((attempt + 1))
      [ "$attempt" -ge "$max_attempts" ] && echo "postgres readiness timeout" && exit 1
      echo "waiting for postgres..."; sleep 2
    done

    attempt=0
    until psql -tAc "SELECT 1 FROM information_schema.tables WHERE table_name='user'" | grep -q 1; do
      attempt=$((attempt + 1))
      [ "$attempt" -ge "$max_attempts" ] && echo "gitea schema timeout" && exit 1
      echo "waiting for gitea schema..."; sleep 2
    done

    EXISTING=$(psql -tAc "SELECT COUNT(*) FROM \"user\" WHERE is_admin = true")
    if [ "$EXISTING" -gt 0 ]; then
      echo "admin already exists, skipping"; exit 0
    fi

    if [ "${GENERATE_PASSWORD:-false}" = "true" ]; then
      ADMIN_PASSWORD=$(head -c 24 /dev/urandom | base64 | tr -d '/+=\n')
    elif [ -z "${ADMIN_PASSWORD:-}" ]; then
      echo "adminUser.password is empty" >&2
      exit 1
    fi

    {{- if $writeSecret }}
    write_admin_password_secret() {
      umask 077
      dir=$(mktemp -d)
      printf '%s' "$ADMIN_USERNAME" > "$dir/username"
      printf '%s' "$ADMIN_EMAIL" > "$dir/email"
      printf '%s' "$ADMIN_PASSWORD" > "$dir/password"
      marker=copia-admin-bootstrap
      label_key="app.kubernetes.io/managed-by"
      if kubectl get secret "$PASSWORD_SECRET_NAME" -n "$PASSWORD_SECRET_NAMESPACE" >/dev/null 2>&1; then
        managed=$(kubectl get secret "$PASSWORD_SECRET_NAME" -n "$PASSWORD_SECRET_NAMESPACE" \
          -o "jsonpath={.metadata.labels['${label_key}']}")
        if [ "$managed" != "$marker" ]; then
          echo "secret ${PASSWORD_SECRET_NAME} exists and is not from admin bootstrap" >&2
          exit 1
        fi
      fi
      kubectl create secret generic "$PASSWORD_SECRET_NAME" \
        -n "$PASSWORD_SECRET_NAMESPACE" \
        --from-file=username="$dir/username" \
        --from-file=email="$dir/email" \
        --from-file=password="$dir/password" \
        --dry-run=client -o yaml \
        | kubectl label --local -f - "${label_key}=${marker}" -o yaml \
        | kubectl apply -f -
      rm -rf "$dir"
      echo "stored initial admin password in secret ${PASSWORD_SECRET_NAME}"
    }
    write_admin_password_secret
    {{- end }}

    SALT=$(head -c 10 /dev/urandom | base64 | tr -d '/+=' | head -c 10)
    HASH=$(printf '%s' "$ADMIN_PASSWORD" | argon2 "$SALT" -id -t 2 -m 16 -p 8 -l 50 | awk '/Hash:/ {print $2}')
    AVATAR=$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 64)

    psql \
      -v ON_ERROR_STOP=1 \
      -v admin_username="$ADMIN_USERNAME" \
      -v admin_email="$ADMIN_EMAIL" \
      -v hash="$HASH" \
      -v salt="$SALT" \
      -v avatar="$AVATAR" <<'SQL'
    INSERT INTO "user" (
      lower_name, name, full_name, email, passwd, passwd_hash_algo,
      type, salt, is_admin, is_active, must_change_password,
      created_unix, updated_unix, last_login_unix,
      email_notifications_preference, avatar, avatar_email
    ) VALUES (
      lower(:'admin_username'), :'admin_username', :'admin_username',
      :'admin_email', :'hash', 'argon2',
      0, :'salt', true, true, true,
      extract(epoch from now())::bigint, extract(epoch from now())::bigint, 0,
      'enabled', :'avatar', :'admin_email'
    );
    SQL

    echo "admin user $ADMIN_USERNAME created"
{{- if $writeSecret }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.fullname" . }}-admin-bootstrap
  labels: {{- include "app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": {{ $hookPolicy | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "app.fullname" . }}-admin-bootstrap
  labels: {{- include "app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": {{ $hookPolicy | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ $secretName | quote }}
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "app.fullname" . }}-admin-bootstrap
  labels: {{- include "app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": {{ $hookPolicy | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "app.fullname" . }}-admin-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "app.fullname" . }}-admin-bootstrap
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.fullname" . }}-admin-bootstrap
  labels: {{- include "app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": {{ $hookPolicy | quote }}
spec:
  backoffLimit: 5
  # RDS path: kubelet blocks on Secret mounts until Instance + app-role are ready
  # (5-15m+), then readiness + schema waits. Non-RDS path stays at 20m.
  activeDeadlineSeconds: {{ if $rdsOn }}3600{{ else }}1200{{ end }}
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      {{- if $writeSecret }}
      serviceAccountName: {{ include "app.fullname" . }}-admin-bootstrap
      {{- end }}
      containers:
        - name: bootstrap
          image: postgres:15-alpine
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            {{- if not $rdsOn }}
            - name: PGHOST
              value: {{ include "copia.database.host" . | quote }}
            - name: PGPORT
              value: {{ include "copia.database.port" . | quote }}
            - name: PGUSER
              value: {{ include "copia.database.user" . | quote }}
            - name: PGDATABASE
              value: {{ include "copia.database.name" . | quote }}
            - name: PGPASSWORD
              value: {{ .Values.copia.config.database.PASSWD | quote }}
            {{- end }}
            - name: ADMIN_USERNAME
              value: {{ .Values.adminUser.username | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.adminUser.email | quote }}
            - name: GENERATE_PASSWORD
              value: {{ $generate | quote }}
            {{- if not $generate }}
            - name: ADMIN_PASSWORD
              value: {{ $password | quote }}
            {{- end }}
            {{- if $writeSecret }}
            - name: PASSWORD_SECRET_ENABLED
              value: "true"
            - name: PASSWORD_SECRET_NAME
              value: {{ $secretName | quote }}
            - name: PASSWORD_SECRET_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- end }}
          volumeMounts:
            - name: script
              mountPath: /scripts
            {{- if $rdsOn }}
            - name: db-connection
              mountPath: /etc/db-connection
              readOnly: true
            - name: app-credentials
              mountPath: /etc/app-credentials
              readOnly: true
            {{- end }}
      volumes:
        - name: script
          configMap:
            name: {{ include "app.fullname" . }}-admin-bootstrap-script
            defaultMode: 0755
        {{- if $rdsOn }}
        - name: db-connection
          secret:
            secretName: {{ include "copia.rds.connectionSecretName" . }}
        - name: app-credentials
          secret:
            secretName: {{ include "copia.rds.appCredentialsSecretName" . }}
        {{- end }}
{{- end }}
