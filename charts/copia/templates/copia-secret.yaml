{{- if hasKey .Values.copia "config" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}-ini
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  app.ini: |
    {{- /* autogenerate app.ini */ -}}
    {{- $autoGen := and .Values.chartGeneratedSecrets .Values.chartGeneratedSecrets.enabled -}}
    {{- $xpOn := eq "true" (include "copia.crossplane.enabled" .) -}}
    {{- $cfg := deepCopy .Values.copia.config -}}
    {{- if eq "true" (include "copia.cnpg.enabled" .) }}
      {{- if not (hasKey $cfg "database") }}
        {{- $_ := set $cfg "database" dict }}
      {{- end }}
      {{- $db := index $cfg "database" }}
      {{- $_ := set $db "HOST" (include "copia.database.hostPort" .) }}
      {{- if not (index $db "DB_TYPE") }}
        {{- $_ := set $db "DB_TYPE" "postgres" }}
      {{- end }}
      {{- if not (index $db "USER") }}
        {{- $_ := set $db "USER" (include "copia.database.user" .) }}
      {{- end }}
      {{- if not (index $db "NAME") }}
        {{- $_ := set $db "NAME" (include "copia.database.name" .) }}
      {{- end }}
    {{- end }}
    {{- if $xpOn }}
      {{- $_ := include "copia.crossplane.validateHosts" . }}
      {{- if not (hasKey $cfg "database") }}
        {{- $_ := set $cfg "database" dict }}
      {{- end }}
      {{- $db := index $cfg "database" }}
      {{- /* Filled at runtime from connection Secret by render-app-ini init. */ -}}
      {{- $_ := set $db "HOST" "###XP_DB_HOST###" }}
      {{- $_ := set $db "USER" "###XP_DB_USER###" }}
      {{- $_ := set $db "PASSWD" "###XP_DB_PASSWD###" }}
      {{- if not (index $db "DB_TYPE") }}
        {{- $_ := set $db "DB_TYPE" "postgres" }}
      {{- end }}
      {{- if not (index $db "NAME") }}
        {{- $_ := set $db "NAME" (include "copia.database.name" .) }}
      {{- end }}
      {{- if not (index $db "SSL_MODE") }}
        {{- $_ := set $db "SSL_MODE" "require" }}
      {{- end }}
    {{- end }}
    {{- if $autoGen -}}
      {{- $autoGenKeys := list
            (list "security"           "INTERNAL_TOKEN")
            (list "security"           "SECRET_KEY")
            (list "oauth2"             "JWT_SECRET")
            (list "server"             "LFS_JWT_SECRET")
            (list "copia"              "USER_SECRETS_PUBLIC_KEY")
            (list "copia"              "USER_SECRETS_PRIVATE_KEY")
            (list "conversion_manager" "MANAGEMENT_TOKEN") -}}
      {{- range $pair := $autoGenKeys -}}
        {{- $section := index $pair 0 -}}
        {{- $key := index $pair 1 -}}
        {{- if not (hasKey $cfg $section) -}}
          {{- $_ := set $cfg $section dict -}}
        {{- end -}}
        {{- $sectionMap := index $cfg $section -}}
        {{- if not (index $sectionMap $key) -}}
          {{- $_ := set $sectionMap $key (printf "###%s###" $key) -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
    {{- range $key, $value := $cfg }}
    {{- if kindIs "map" $value }}
    {{- if gt (len $value) 0 }}

    [{{ $key }}]
    {{- range $n_key, $n_value := $value }}
    {{ $n_key | upper }} = {{ $n_value }}
    {{- end }}
    {{- end }}
    {{- else }}
    {{ $key | upper }} = {{ $value }}
    {{- end }}
    {{- end }}
{{- end }}
