{{- define "copia.tlsMaterial" -}}
{{- $raw := .value | trim -}}
{{- if contains "BEGIN " $raw -}}
{{- $raw | b64enc -}}
{{- else -}}
{{- $b64 := $raw | nospace -}}
{{- if not (regexMatch "^[A-Za-z0-9+/=]+$" $b64) -}}
{{- fail (printf "%s must be base64-encoded PEM on one line." .path) -}}
{{- end -}}
{{- if not (contains "BEGIN " ($b64 | b64dec)) -}}
{{- fail (printf "%s must be base64-encoded PEM." .path) -}}
{{- end -}}
{{- $b64 -}}
{{- end -}}
{{- end -}}
{{- $_ := include "copia.tls.validate" . }}
{{- $t := .Values.tls | default dict }}
{{- $rows := list }}
{{- with $t.copia }}
{{- if .certificate }}
{{- $rows = append $rows (dict
      "path" "tls.copia"
      "secretName" (include "copia.tls.copiaSecretName" $)
      "certificate" .certificate
      "privateKey" .privateKey
      "labels" (include "app.labels" $)
) }}
{{- end }}
{{- end }}
{{- if eq (toString .Values.conversion_manager_service.enabled) "true" }}
{{- with $t.conversionManager }}
{{- if .certificate }}
{{- $rows = append $rows (dict
      "path" "tls.conversionManager"
      "secretName" (include "copia.tls.cmSecretName" $)
      "certificate" .certificate
      "privateKey" .privateKey
      "labels" (include "app.conversion-manager.labels" $)
) }}
{{- end }}
{{- end }}
{{- end }}
{{- $seen := dict }}
{{- range $row := $rows }}
{{- if not (hasKey $seen $row.secretName) }}
{{- $_ := set $seen $row.secretName true }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $row.secretName }}
{{- if $existing }}
{{- $owner := dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing }}
{{- if ne $owner $.Release.Name }}
{{- fail (printf "Secret %s already exists in namespace %s and this release does not manage it. Either delete it (kubectl delete secret -n %s %s) so the chart can create it from %s.certificate and %s.privateKey, or keep it and remove %s.certificate and %s.privateKey so the chart uses it as is." $row.secretName $.Release.Namespace $.Release.Namespace $row.secretName $row.path $row.path $row.path $row.path) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $row.secretName }}
  labels:
    {{- $row.labels | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ include "copia.tlsMaterial" (dict "value" $row.certificate "path" (printf "%s.certificate" $row.path)) | trim | quote }}
  tls.key: {{ include "copia.tlsMaterial" (dict "value" $row.privateKey "path" (printf "%s.privateKey" $row.path)) | trim | quote }}
{{- end }}
{{- end }}
