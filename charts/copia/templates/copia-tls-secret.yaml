{{- define "copia.tlsMaterial" -}}
{{- $raw := .value | trim -}}
{{- if contains "BEGIN " $raw -}}
{{- $raw | b64enc -}}
{{- else -}}
{{- $b64 := $raw | nospace -}}
{{- if not (regexMatch "^[A-Za-z0-9+/=]+$" $b64) -}}
{{- fail (printf "%s must be base64-encoded PEM on one line." .path) -}}
{{- end -}}
{{- if not (contains "BEGIN " ($b64 | b64dec)) -}}
{{- fail (printf "%s must be base64-encoded PEM." .path) -}}
{{- end -}}
{{- $b64 -}}
{{- end -}}
{{- end -}}
{{- $rows := list }}
{{- if .Values.ingress }}
{{- range $tls := .Values.ingress.tls }}
{{- $rows = append $rows (dict
      "path" "ingress.tls"
      "secretName" ($tls.secretName | default "")
      "certificate" ($tls.certificate | default "")
      "privateKey" ($tls.privateKey | default "")
      "labels" (include "app.labels" $)
) }}
{{- end }}
{{- end }}
{{- if and .Values.conversion_manager_service .Values.conversion_manager_service.ingress }}
{{- range $tls := .Values.conversion_manager_service.ingress.tls }}
{{- $rows = append $rows (dict
      "path" "conversion_manager_service.ingress.tls"
      "secretName" ($tls.secretName | default "")
      "certificate" ($tls.certificate | default "")
      "privateKey" ($tls.privateKey | default "")
      "labels" (include "app.conversion-manager.labels" $)
) }}
{{- end }}
{{- end }}
{{- $seen := dict }}
{{- range $row := $rows }}
{{- $cert := $row.certificate }}
{{- $key := $row.privateKey }}
{{- if and $cert (not $key) }}
{{- fail (printf "%s.certificate is set without %s.privateKey." $row.path $row.path) }}
{{- else if and $key (not $cert) }}
{{- fail (printf "%s.privateKey is set without %s.certificate." $row.path $row.path) }}
{{- else if and $cert $key }}
{{- if eq $row.path "ingress.tls" }}
{{- if not $.Values.ingress.enabled }}
{{- fail "ingress.tls certificate and privateKey require ingress.enabled." }}
{{- end }}
{{- else }}
{{- if not $.Values.conversion_manager_service.enabled }}
{{- fail (printf "%s certificate and privateKey require %s."
  "conversion_manager_service.ingress.tls" "conversion_manager_service.enabled") }}
{{- end }}
{{- if not $.Values.conversion_manager_service.ingress.enabled }}
{{- fail (printf "%s certificate and privateKey require %s."
  "conversion_manager_service.ingress.tls" "conversion_manager_service.ingress.enabled") }}
{{- end }}
{{- end }}
{{- if not $row.secretName }}
{{- fail (printf "%s.secretName is required when certificate and privateKey are set." $row.path) }}
{{- end }}
{{- $certStored := include "copia.tlsMaterial" (dict "value" $cert "path" (printf "%s.certificate" $row.path)) | trim }}
{{- $keyStored := include "copia.tlsMaterial" (dict "value" $key "path" (printf "%s.privateKey" $row.path)) | trim }}
{{- if hasKey $seen $row.secretName }}
{{- $prior := index $seen $row.secretName }}
{{- if or (ne (index $prior "certificate") $cert) (ne (index $prior "privateKey") $key) }}
{{- fail (printf "TLS secret %s is set twice with different certificate material." $row.secretName) }}
{{- end }}
{{- else }}
{{- $_ := set $seen $row.secretName (dict "certificate" $cert "privateKey" $key) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $row.secretName }}
  labels:
    {{- $row.labels | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $certStored | quote }}
  tls.key: {{ $keyStored | quote }}
{{- end }}
{{- end }}
{{- end }}
