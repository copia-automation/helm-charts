suite: Test Cloud SQL app-role (chart-owned Windsor opt-in)
templates:
  - cloudsql-app-role.yaml
tests:
  - it: renders nothing when cloudsql disabled
    asserts:
      - hasDocuments:
          count: 0
  - it: renders ClusterRole CronJob and namespace Role for Copia
    capabilities:
      apiVersions:
        - sql.gcp.upbound.io/v1beta2
    set:
      database.provider: cloudsql
      cloudsql.instanceName: copia-poc-pg
      cloudsql.region: us-central1
      cloudsql.privateNetwork: projects/staging/global/networks/vpc
    asserts:
      - hasDocuments:
          count: 5
      - documentSelector:
          path: kind
          value: ClusterRole
        equal:
          path: metadata.name
          value: copia-poc-pg-app-reader
      - documentSelector:
          path: kind
          value: ClusterRole
        equal:
          path: rules[0].resources[0]
          value: databaseinstances
      - documentSelector:
          path: kind
          value: ClusterRole
        equal:
          path: rules[0].resourceNames[0]
          value: copia-poc-pg
      - documentSelector:
          path: kind
          value: CronJob
        equal:
          path: metadata.name
          value: copia-poc-pg-provision-app-role
      - documentSelector:
          path: kind
          value: CronJob
        equal:
          path: metadata.namespace
          value: system-provisioning
      - documentSelector:
          path: kind
          value: CronJob
        equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: cloudsql-bootstrap
      - documentSelector:
          path: kind
          value: CronJob
        matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[2]
          pattern: "copia-poc-pg-app-credentials"
      - documentSelector:
          path: kind
          value: CronJob
        matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[2]
          pattern: "copia-poc-pg-connection"
      - documentSelector:
          path: kind
          value: CronJob
        matchRegex:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].command[2]
          pattern: "privateIpAddress"
      - documentSelector:
          path: kind
          value: Role
        equal:
          path: metadata.name
          value: copia-poc-pg-app-reader
  - it: renders a second app-role set for conversion-manager
    capabilities:
      apiVersions:
        - sql.gcp.upbound.io/v1beta2
    set:
      database.provider: cloudsql
      conversion_manager_service.enabled: true
      cloudsql.region: us-central1
      cloudsql.privateNetwork: projects/staging/global/networks/vpc
    asserts:
      - hasDocuments:
          count: 10
      - documentSelector:
          path: metadata.name
          value: RELEASE-NAME-copia-cm-pg-provision-app-role
        equal:
          path: kind
          value: CronJob
  - it: can disable chart app-role when wiring Windsor component separately
    capabilities:
      apiVersions:
        - sql.gcp.upbound.io/v1beta2
    set:
      database.provider: cloudsql
      cloudsql.appRole.enabled: false
      cloudsql.region: us-central1
      cloudsql.privateNetwork: projects/staging/global/networks/vpc
    asserts:
      - hasDocuments:
          count: 0
