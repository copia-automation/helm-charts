suite: Test Conversion Manager ConfigMap
templates:
  - conversion-manager-configmap.yaml
tests:
  - it: Test ConfigMap name
    set:
      conversion_manager_service.enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: metadata.name
          pattern: conversion-manager-configmap
  - it: Test ConfigMap default values
    set:
      conversion_manager_service.enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: metadata.name
          pattern: conversion-manager-configmap
      - equal:
          path: data.LOGGER_LEVEL
          value: "debug"
      - equal:
          path: data.NODE_ENV
          value: "production"
      - equal:
          path: data.PORT
          value: "8888"
      - equal:
          path: data.HOST
          value: "localhost"
      - equal:
          path: data.ADMIN_ID
          value: "admin"
      - equal:
          path: data.COPIA_USER_ID
          value: "copiaUser"
      - equal:
          path: data.COPIA_TEAM_ID
          value: "copiaTeam"
      - equal:
          path: data.DB_USER
          value: "postgres"
      - equal:
          path: data.DB_HOST
          value: "localhost:5441"
      - equal:
          path: data.ENABLE_HTTPS
          value: "false"
  - it: CloudNativePG sets DB_HOST from the Cluster and remaps reserved DB_USER
    set:
      conversion_manager_service.enabled: true
      cloudnativePG.enabled: true
      cloudnativePG.clusterName: copia-pg
      conversion_manager_service.configmap.DB_USER: postgres
      conversion_manager_service.configmap.DB_NAME: conversion_manager
    asserts:
      - equal:
          path: data.DB_HOST
          value: "copia-pg-rw:5432"
      - equal:
          path: data.DB_USER
          value: "conversion_manager"
      - equal:
          path: data.DB_NAME
          value: "conversion_manager"
  - it: fails when Crossplane is enabled with an external DB_HOST
    set:
      conversion_manager_service.enabled: true
      cloudnativePG.enabled: true
      conversion_manager_service.configmap.DB_HOST: postgres.example.com:5432
    asserts:
      - failedTemplate:
          errorPattern: "omit conversion_manager_service.configmap.DB_HOST"
  - it: Crossplane omits DB_HOST and remaps DB_USER when CM is enabled
    set:
      conversion_manager_service.enabled: true
      database.provider: crossplane
      crossplane.parameters.region: us-east-2
      crossplane.parameters.subnetIds: ["subnet-a", "subnet-b"]
      crossplane.parameters.vpcSecurityGroupIds: ["sg-a"]
      conversion_manager_service.configmap.DB_USER: postgres
      conversion_manager_service.configmap.DB_NAME: conversion_manager
      conversion_manager_service.secret.DB_PASSWORD: cm-secret
    asserts:
      - notExists:
          path: data.DB_HOST
      - equal:
          path: data.DB_USER
          value: "conversion_manager"
      - equal:
          path: data.DB_NAME
          value: "conversion_manager"
  - it: fails when Crossplane CM is enabled with an external DB_HOST
    set:
      conversion_manager_service.enabled: true
      database.provider: crossplane
      crossplane.parameters.region: us-east-2
      crossplane.parameters.subnetIds: ["subnet-a", "subnet-b"]
      crossplane.parameters.vpcSecurityGroupIds: ["sg-a"]
      conversion_manager_service.configmap.DB_HOST: postgres.example.com:5432
      conversion_manager_service.secret.DB_PASSWORD: cm-secret
    asserts:
      - failedTemplate:
          errorPattern: "omit conversion_manager_service.configmap.DB_HOST"
