suite: Test Copia TLS Secret
templates:
  - copia-tls-secret.yaml
tests:
  - it: renders nothing when certificate material is absent
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing when ingress TLS has no certificate material
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: copia-tls
          hosts:
            - copia.example.com
    asserts:
      - hasDocuments:
          count: 0
  - it: creates a TLS secret from certificate and private key
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: copia-tls
          hosts:
            - copia.example.com
          certificate: |
            -----BEGIN CERTIFICATE-----
            TESTCERT
            -----END CERTIFICATE-----
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            TESTKEY
            -----END PRIVATE KEY-----
    asserts:
      - isKind:
          of: Secret
      - hasDocuments:
          count: 1
      - equal:
          path: type
          value: kubernetes.io/tls
      - equal:
          path: metadata.name
          value: copia-tls
      - matchRegex:
          path: data["tls.crt"]
          pattern: "^[A-Za-z0-9+/=]+$"
      - matchRegex:
          path: data["tls.key"]
          pattern: "^[A-Za-z0-9+/=]+$"
  - it: creates one secret per tls entry that has material
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: copia-tls
          hosts:
            - copia.example.com
          certificate: |
            -----BEGIN CERTIFICATE-----
            APP
            -----END CERTIFICATE-----
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            APPKEY
            -----END PRIVATE KEY-----
        - secretName: copia-extra-tls
          hosts:
            - extra.example.com
          certificate: |
            -----BEGIN CERTIFICATE-----
            EXTRA
            -----END CERTIFICATE-----
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            EXTRAKEY
            -----END PRIVATE KEY-----
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: copia-tls
        documentIndex: 0
      - equal:
          path: metadata.name
          value: copia-extra-tls
        documentIndex: 1
  - it: fails when the certificate is set without a private key
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: copia-tls
          hosts:
            - copia.example.com
          certificate: |
            -----BEGIN CERTIFICATE-----
            TESTCERT
            -----END CERTIFICATE-----
    asserts:
      - failedTemplate:
          errorPattern: "without ingress.tls.privateKey"
  - it: fails when the private key is set without a certificate
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: copia-tls
          hosts:
            - copia.example.com
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            TESTKEY
            -----END PRIVATE KEY-----
    asserts:
      - failedTemplate:
          errorPattern: "without ingress.tls.certificate"
  - it: fails when certificate material is set and ingress is disabled
    set:
      ingress.enabled: false
      ingress.tls:
        - secretName: copia-tls
          certificate: |
            -----BEGIN CERTIFICATE-----
            TESTCERT
            -----END CERTIFICATE-----
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            TESTKEY
            -----END PRIVATE KEY-----
    asserts:
      - failedTemplate:
          errorPattern: "require ingress.enabled"
  - it: fails when certificate material is set without secretName
    set:
      ingress.enabled: true
      ingress.tls:
        - hosts:
            - copia.example.com
          certificate: |
            -----BEGIN CERTIFICATE-----
            TESTCERT
            -----END CERTIFICATE-----
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            TESTKEY
            -----END PRIVATE KEY-----
    asserts:
      - failedTemplate:
          errorPattern: "secretName is required"
  - it: creates a conversion-manager TLS secret
    set:
      conversion_manager_service.enabled: true
      conversion_manager_service.ingress.enabled: true
      conversion_manager_service.ingress.tls:
        - secretName: conversion-manager-tls
          hosts:
            - conversion.example.com
          certificate: |
            -----BEGIN CERTIFICATE-----
            CM
            -----END CERTIFICATE-----
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            CMKEY
            -----END PRIVATE KEY-----
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: conversion-manager-tls
      - matchRegex:
          path: metadata.labels.app
          pattern: conversion-manager
  - it: reuses one secret when both ingresses name it
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: copia-tls
          hosts:
            - copia.example.com
          certificate: |
            -----BEGIN CERTIFICATE-----
            WILD
            -----END CERTIFICATE-----
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            WILDKEY
            -----END PRIVATE KEY-----
      conversion_manager_service.enabled: true
      conversion_manager_service.ingress.enabled: true
      conversion_manager_service.ingress.tls:
        - secretName: copia-tls
          hosts:
            - conversion.example.com
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: copia-tls
      - matchRegex:
          path: data["tls.crt"]
          pattern: "^[A-Za-z0-9+/=]+$"
  - it: accepts the same material on both ingresses for one secret
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: copia-tls
          hosts:
            - copia.example.com
          certificate: |
            -----BEGIN CERTIFICATE-----
            WILD
            -----END CERTIFICATE-----
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            WILDKEY
            -----END PRIVATE KEY-----
      conversion_manager_service.enabled: true
      conversion_manager_service.ingress.enabled: true
      conversion_manager_service.ingress.tls:
        - secretName: copia-tls
          hosts:
            - conversion.example.com
          certificate: |
            -----BEGIN CERTIFICATE-----
            WILD
            -----END CERTIFICATE-----
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            WILDKEY
            -----END PRIVATE KEY-----
    asserts:
      - hasDocuments:
          count: 1
  - it: fails when one secret name is given two certificates
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: copia-tls
          hosts:
            - copia.example.com
          certificate: |
            -----BEGIN CERTIFICATE-----
            ONE
            -----END CERTIFICATE-----
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            ONEKEY
            -----END PRIVATE KEY-----
      conversion_manager_service.enabled: true
      conversion_manager_service.ingress.enabled: true
      conversion_manager_service.ingress.tls:
        - secretName: copia-tls
          hosts:
            - conversion.example.com
          certificate: |
            -----BEGIN CERTIFICATE-----
            TWO
            -----END CERTIFICATE-----
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            TWOKEY
            -----END PRIVATE KEY-----
    asserts:
      - failedTemplate:
          errorPattern: "different certificate material"
  - it: fails when conversion-manager certificate material is set and its ingress is disabled
    set:
      conversion_manager_service.enabled: true
      conversion_manager_service.ingress.enabled: false
      conversion_manager_service.ingress.tls:
        - secretName: conversion-manager-tls
          certificate: |
            -----BEGIN CERTIFICATE-----
            CM
            -----END CERTIFICATE-----
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            CMKEY
            -----END PRIVATE KEY-----
    asserts:
      - failedTemplate:
          errorPattern: "require conversion_manager_service.ingress.enabled"
  - it: writes a one-line base64 secret value through unchanged
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: copia-tls
          hosts:
            - copia.example.com
          certificate: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCkFCQwotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0tCg==
          privateKey: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCkRFRgotLS0tLUVORCBQUklWQVRFIEtFWS0tLS0tCg==
    asserts:
      - equal:
          path: data["tls.crt"]
          value: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCkFCQwotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0tCg==
      - equal:
          path: data["tls.key"]
          value: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCkRFRgotLS0tLUVORCBQUklWQVRFIEtFWS0tLS0tCg==
  - it: fails when the certificate is not base64 PEM
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: copia-tls
          hosts:
            - copia.example.com
          certificate: not-a-certificate
          privateKey: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCkRFRgotLS0tLUVORCBQUklWQVRFIEtFWS0tLS0tCg==
    asserts:
      - failedTemplate:
          errorPattern: "base64-encoded PEM on one line"
