suite: Test Copia TLS Secret
templates:
  - copia-tls-secret.yaml
release:
  name: r
set:
  copia.config.server.HTTP_PORT: 4001
tests:
  - it: renders nothing when tls is unset
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing for a Secret the customer manages
    set:
      tls.copia.secretName: customer-tls
    asserts:
      - hasDocuments:
          count: 0
  - it: creates a TLS secret from certificate and private key
    set:
      tls.copia:
        certificate: |
          -----BEGIN CERTIFICATE-----
          TESTCERT
          -----END CERTIFICATE-----
        privateKey: |
          -----BEGIN PRIVATE KEY-----
          TESTKEY
          -----END PRIVATE KEY-----
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: type
          value: kubernetes.io/tls
      - equal:
          path: metadata.name
          value: r-copia-tls
      - equal:
          path: data["tls.crt"]
          value: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tClRFU1RDRVJUCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0=
  - it: creates the secret without any Ingress enabled
    set:
      ingress.enabled: false
      tls.copia:
        secretName: copia-tls
        certificate: "-----BEGIN CERTIFICATE-----\nA\n-----END CERTIFICATE-----"
        privateKey: "-----BEGIN PRIVATE KEY-----\nA\n-----END PRIVATE KEY-----"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: copia-tls
  - it: writes a one-line base64 secret value through unchanged
    set:
      tls.copia:
        certificate: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCkEKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQ==
        privateKey: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCkEKLS0tLS1FTkQgUFJJVkFURSBLRVktLS0tLQ==
    asserts:
      - equal:
          path: data["tls.crt"]
          value: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCkEKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQ==
  - it: creates a separate conversion-manager secret
    set:
      conversion_manager_service.enabled: true
      tls.copia:
        certificate: "-----BEGIN CERTIFICATE-----\nA\n-----END CERTIFICATE-----"
        privateKey: "-----BEGIN PRIVATE KEY-----\nA\n-----END PRIVATE KEY-----"
      tls.conversionManager:
        certificate: "-----BEGIN CERTIFICATE-----\nB\n-----END CERTIFICATE-----"
        privateKey: "-----BEGIN PRIVATE KEY-----\nB\n-----END PRIVATE KEY-----"
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: r-copia-tls
        documentIndex: 0
      - equal:
          path: metadata.name
          value: conversion-manager-tls
        documentIndex: 1
  - it: shares one secret when both name it with the same material
    set:
      conversion_manager_service.enabled: true
      tls.copia:
        secretName: shared-tls
        certificate: "-----BEGIN CERTIFICATE-----\nA\n-----END CERTIFICATE-----"
        privateKey: "-----BEGIN PRIVATE KEY-----\nA\n-----END PRIVATE KEY-----"
      tls.conversionManager:
        secretName: shared-tls
        certificate: "-----BEGIN CERTIFICATE-----\nA\n-----END CERTIFICATE-----"
        privateKey: "-----BEGIN PRIVATE KEY-----\nA\n-----END PRIVATE KEY-----"
    asserts:
      - hasDocuments:
          count: 1
  - it: fails when one secret name is given two certificates
    set:
      conversion_manager_service.enabled: true
      tls.copia:
        secretName: shared-tls
        certificate: "-----BEGIN CERTIFICATE-----\nA\n-----END CERTIFICATE-----"
        privateKey: "-----BEGIN PRIVATE KEY-----\nA\n-----END PRIVATE KEY-----"
      tls.conversionManager:
        secretName: shared-tls
        certificate: "-----BEGIN CERTIFICATE-----\nB\n-----END CERTIFICATE-----"
        privateKey: "-----BEGIN PRIVATE KEY-----\nB\n-----END PRIVATE KEY-----"
    asserts:
      - failedTemplate:
          errorPattern: TLS secret shared-tls is set twice with different certificate material
  - it: fails when the certificate is set without a private key
    set:
      tls.copia.certificate: "-----BEGIN CERTIFICATE-----\nA\n-----END CERTIFICATE-----"
    asserts:
      - failedTemplate:
          errorMessage: tls.copia.certificate is set without tls.copia.privateKey.
  - it: fails when the private key is set without a certificate
    set:
      tls.copia.privateKey: "-----BEGIN PRIVATE KEY-----\nA\n-----END PRIVATE KEY-----"
    asserts:
      - failedTemplate:
          errorMessage: tls.copia.privateKey is set without tls.copia.certificate.
  - it: fails when conversion manager is set up without Copia
    set:
      conversion_manager_service.enabled: true
      tls.conversionManager.secretName: cm-tls
    asserts:
      - failedTemplate:
          errorPattern: tls.conversionManager requires tls.copia
  - it: fails when the certificate is not base64 PEM
    set:
      tls.copia:
        certificate: not-pem!
        privateKey: "-----BEGIN PRIVATE KEY-----\nA\n-----END PRIVATE KEY-----"
    asserts:
      - failedTemplate:
          errorMessage: tls.copia.certificate must be base64-encoded PEM on one line.
  - it: fails when the base64 does not decode to PEM
    set:
      tls.copia:
        certificate: aGVsbG8=
        privateKey: "-----BEGIN PRIVATE KEY-----\nA\n-----END PRIVATE KEY-----"
    asserts:
      - failedTemplate:
          errorMessage: tls.copia.certificate must be base64-encoded PEM.
  - it: fails when a Secret of the same name exists outside the release
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: r-copia-tls
            namespace: NAMESPACE
    set:
      tls.copia:
        certificate: "-----BEGIN CERTIFICATE-----\nA\n-----END CERTIFICATE-----"
        privateKey: "-----BEGIN PRIVATE KEY-----\nA\n-----END PRIVATE KEY-----"
    asserts:
      - failedTemplate:
          errorPattern: Secret r-copia-tls already exists in namespace NAMESPACE and this release does not manage it
