suite: Test Copia Ingress
templates:
  - copia-ingress.yaml
tests:
  - it: Test ingress name
    set:
      ingress.enabled: true
    asserts:
      - isKind:
          of: Ingress
      - matchRegex:
          path: metadata.name
          pattern: copia
  - it: Test ingress default values
    set:
      ingress.enabled: true
    asserts:
      - isKind:
          of: Ingress
      - matchRegex:
          path: metadata.name
          pattern: copia
      - equal:
          path: spec.rules[0].host
          value: git.example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
  - it: references the TLS secret and omits certificate material
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: copia-tls
          hosts:
            - copia.example.com
          certificate: |
            -----BEGIN CERTIFICATE-----
            TESTCERT
            -----END CERTIFICATE-----
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            TESTKEY
            -----END PRIVATE KEY-----
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: copia-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: copia.example.com
      - notExists:
          path: spec.tls[0].certificate
      - notExists:
          path: spec.tls[0].privateKey
