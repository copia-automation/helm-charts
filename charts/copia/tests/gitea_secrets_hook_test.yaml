suite: Test Gitea secrets pre-install hook
templates:
  - gitea-secrets-hook.yaml
tests:
  - it: should render nothing when chartGeneratedSecrets is disabled
    asserts:
      - hasDocuments:
          count: 0
  - it: should render when Gitea generation is on and conversion-manager tokens are off
    set:
      chartGeneratedSecrets.enabled: true
      chartGeneratedSecrets.conversionManager.enabled: false
    asserts:
      - hasDocuments:
          count: 4
  - it: should render nothing when only conversion-manager token generation is on
    set:
      chartGeneratedSecrets.enabled: false
      chartGeneratedSecrets.conversionManager.enabled: true
    asserts:
      - hasDocuments:
          count: 0
