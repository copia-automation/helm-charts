suite: Test Conversion Manager Deployment
templates:
  - conversion-manager-deployment.yaml
tests:
  - it: Test Repository, Image version & Pull policy
    set:
      conversion_manager_service.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: conversion-manager
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ghcr.io/copia-automation/conversion-manager:v\d+\.\d+\.\d+
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
  - it: Test default values
    set:
      conversion_manager_service.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: conversion-manager
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8888
      - equal:
          path: spec.template.spec.containers[0].name
          value: "conversion-manager"
  - it: Test volume mounts & volumes
    set:
      conversion_manager_service.enabled: true
      conversion_manager_service.deployment.volumeMounts:
        - name: ephemeral-storage
          mountPath: /tmp/conversion-manager
      conversion_manager_service.deployment.volumes:
        - name: ephemeral-storage
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  type: conversion-manager-ephemeral-data
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClass: conversion-manager-ebs-gp3
                resources:
                  requests:
                    storage: 100Gi
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: conversion-manager
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "ephemeral-storage"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/tmp/conversion-manager"
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "ephemeral-storage"
      - equal:
          path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.metadata.labels.type
          value: "conversion-manager-ephemeral-data"
      - equal:
          path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.spec.storageClass
          value: "conversion-manager-ebs-gp3"
      - equal:
          path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.spec.resources.requests.storage
          value: "100Gi"
  - it: Test environment
    set:
      conversion_manager_service.enabled: true
      conversion_manager_service.deployment.env:
        - name: DD_AGENT_HOST
          value: "10.0.0.1"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: "DD_AGENT_HOST"
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "10.0.0.1"
  - it: Test nodeSelector, affinity & tolerations
    set:
      conversion_manager_service.enabled: true
      conversion_manager_service.deployment.nodeSelector:
        copia-nodegroup: copia-workers
      conversion_manager_service.deployment.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                - us-east-1
                - us-west-1
      conversion_manager_service.deployment.tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "copia-workers"
          effect: "NoSchedule"
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: conversion-manager
      - equal:
          path: spec.template.spec.nodeSelector.copia-nodegroup
          value: "copia-workers"
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: "topology.kubernetes.io/zone"
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: "dedicated"
  - it: Test extra envFrom when chartGeneratedSecrets is enabled
    set:
      conversion_manager_service.enabled: true
      chartGeneratedSecrets.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: conversion-manager-secrets
  - it: Test no extra envFrom when chartGeneratedSecrets is disabled
    set:
      conversion_manager_service.enabled: true
      chartGeneratedSecrets.enabled: false
    asserts:
      - isKind:
          of: Deployment
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: conversion-manager-secrets
  - it: waits for CloudNativePG before starting
    set:
      conversion_manager_service.enabled: true
      cloudnativePG.enabled: true
      cloudnativePG.clusterName: copia-pg
      copia.config.database.PASSWD: s3cret
      conversion_manager_service.configmap.DB_NAME: conversion_manager
      conversion_manager_service.configmap.DB_USER: conversion_manager
      conversion_manager_service.secret.DB_PASSWORD: cm-secret
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-postgres
      - equal:
          path: spec.template.spec.initContainers[0].env[0].value
          value: copia-pg-rw
      - equal:
          path: spec.template.spec.initContainers[0].env[2].value
          value: conversion_manager
      - equal:
          path: spec.template.spec.initContainers[0].env[4].value
          value: conversion_manager
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: pg_isready
  - it: bootstraps and waits on Crossplane RDS before starting
    capabilities:
      apiVersions:
        - aws.copia.io/v1alpha1
    set:
      conversion_manager_service.enabled: true
      database.provider: crossplane
      crossplane.parameters.region: us-east-2
      crossplane.parameters.subnetIds: ["subnet-a", "subnet-b"]
      crossplane.parameters.vpcSecurityGroupIds: ["sg-a"]
      conversion_manager_service.configmap.DB_NAME: conversion_manager
      conversion_manager_service.configmap.DB_USER: conversion_manager
      conversion_manager_service.secret.DB_PASSWORD: cm-secret
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: cm-bootstrap-db
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: wait-postgres
      - notExists:
          path: spec.template.spec.initContainers[1].env
      - matchRegex:
          path: spec.template.spec.initContainers[1].args[0]
          pattern: conversion_manager
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: /bin/sh
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: RELEASE-NAME-db-app
      - equal:
          path: spec.template.spec.volumes[1].emptyDir
          value: {}
  - it: fails when Crossplane CM is enabled without DB_PASSWORD
    capabilities:
      apiVersions:
        - aws.copia.io/v1alpha1
    set:
      conversion_manager_service.enabled: true
      database.provider: crossplane
      crossplane.parameters.region: us-east-2
      crossplane.parameters.subnetIds: ["subnet-a", "subnet-b"]
      crossplane.parameters.vpcSecurityGroupIds: ["sg-a"]
    asserts:
      - failedTemplate:
          errorPattern: "conversion_manager_service.secret.DB_PASSWORD"

