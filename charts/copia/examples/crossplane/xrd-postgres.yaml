---
# Staging / spike XRD. Apply before helm install with database.provider=crossplane.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xpostgresinstances.aws.copia.io
spec:
  group: aws.copia.io
  names:
    kind: XPostgresInstance
    plural: xpostgresinstances
  claimNames:
    kind: PostgresInstance
    plural: postgresinstances
  connectionSecretKeys:
    - user
    - password
    - host
    - port
    - dbname
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    region:
                      type: string
                    engineVersion:
                      type: string
                      default: "15"
                    instanceClass:
                      type: string
                      default: db.t4g.micro
                    allocatedStorage:
                      type: integer
                      default: 20
                    dbName:
                      type: string
                      default: copia
                    username:
                      type: string
                      default: copia
                    subnetIds:
                      type: array
                      items:
                        type: string
                      minItems: 2
                    vpcSecurityGroupIds:
                      type: array
                      items:
                        type: string
                      minItems: 1
                    providerConfigName:
                      type: string
                      default: default
                    skipFinalSnapshot:
                      type: boolean
                      default: true
                  required:
                    - region
                    - subnetIds
                    - vpcSecurityGroupIds
              required:
                - parameters
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
