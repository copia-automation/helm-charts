---
# Staging / spike Composition (Crossplane v2 pipeline mode).
# Remaps connection Secret keys to the nexus contract:
# user, password, host, port, dbname.
#
# Connection Secret: the chart Claim sets spec.writeConnectionSecretToRef (name
# only), so Crossplane publishes the aggregate secret in the Claim namespace
# (the Helm release namespace). Do not pin writeConnectionSecretsToNamespace to
# crossplane-system — the Deployment mounts the Secret in .Release.Namespace.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xpostgresinstances.aws.copia.io
  labels:
    aws.copia.io/provider: aws
spec:
  compositeTypeRef:
    apiVersion: aws.copia.io/v1alpha1
    kind: XPostgresInstance
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: subnetgroup
            base:
              apiVersion: rds.aws.upbound.io/v1beta1
              kind: SubnetGroup
              spec:
                forProvider:
                  description: Crossplane-managed DB subnet group for Copia Postgres
                  tags:
                    managed-by: crossplane
                    project: copia
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.subnetIds
                toFieldPath: spec.forProvider.subnetIds
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigName
                toFieldPath: spec.providerConfigRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-subnets"
          - name: instance
            base:
              apiVersion: rds.aws.upbound.io/v1beta1
              kind: Instance
              spec:
                forProvider:
                  engine: postgres
                  engineVersion: "15"
                  instanceClass: db.t4g.micro
                  allocatedStorage: 20
                  storageEncrypted: true
                  backupRetentionPeriod: 7
                  deletionProtection: true
                  dbName: copia
                  username: copia
                  autoGeneratePassword: true
                  publiclyAccessible: false
                  skipFinalSnapshot: false
                  passwordSecretRef:
                    namespace: crossplane-system
                    key: password
                  tags:
                    managed-by: crossplane
                    project: copia
                providerConfigRef:
                  name: default
                writeConnectionSecretToRef:
                  namespace: crossplane-system
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.engineVersion
                toFieldPath: spec.forProvider.engineVersion
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.instanceClass
                toFieldPath: spec.forProvider.instanceClass
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.allocatedStorage
                toFieldPath: spec.forProvider.allocatedStorage
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dbName
                toFieldPath: spec.forProvider.dbName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.username
                toFieldPath: spec.forProvider.username
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.vpcSecurityGroupIds
                toFieldPath: spec.forProvider.vpcSecurityGroupIds
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.skipFinalSnapshot
                toFieldPath: spec.forProvider.skipFinalSnapshot
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.deletionProtection
                toFieldPath: spec.forProvider.deletionProtection
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.finalSnapshotIdentifier
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-final"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigName
                toFieldPath: spec.providerConfigRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.identifier
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.dbSubnetGroupName
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-subnets"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.uid
                toFieldPath: spec.forProvider.passwordSecretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-pgpass"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.uid
                toFieldPath: spec.writeConnectionSecretToRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-rds"
            connectionDetails:
              - name: user
                type: FromConnectionSecretKey
                fromConnectionSecretKey: username
              - name: password
                type: FromConnectionSecretKey
                fromConnectionSecretKey: password
              - name: host
                type: FromConnectionSecretKey
                fromConnectionSecretKey: host
              - name: port
                type: FromConnectionSecretKey
                fromConnectionSecretKey: port
              - name: dbname
                type: FromFieldPath
                fromFieldPath: spec.forProvider.dbName
