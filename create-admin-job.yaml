# One-off Job: insert an admin user if the post-install bootstrap failed.
#
# 1. Fill in ADMIN_USERNAME, ADMIN_EMAIL, ADMIN_PASSWORD below.
# 2. Set PG* to the Copia Postgres connection (same as copia.config.database).
#    CloudNativePG: PGHOST is <release>-pg-rw (for example copia-pg-rw).
#    Set PGSSLMODE to require if the server does not accept non-SSL clients.
# 3. Apply, then check logs:
#      kubectl apply -n copia -f create-admin-job.yaml
#      kubectl logs -n copia job/copia-admin-create
# 4. Delete the Job before applying again:
#      kubectl delete job -n copia copia-admin-create --ignore-not-found
#
# Unlike bootstrap, this does not skip just because some admin already exists.
# It skips only if this username or email is already present. First login
# still requires a password change.
apiVersion: batch/v1
kind: Job
metadata:
  name: copia-admin-create
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-admin
          image: postgres:15-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache argon2 >/dev/null

              : "${ADMIN_USERNAME:?ADMIN_USERNAME is required}"
              : "${ADMIN_EMAIL:?ADMIN_EMAIL is required}"
              : "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"

              max_attempts=120
              attempt=0
              until pg_isready -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -t 2; do
                attempt=$((attempt + 1))
                [ "$attempt" -ge "$max_attempts" ] && echo "postgres readiness timeout" && exit 1
                echo "waiting for postgres..."; sleep 2
              done

              attempt=0
              until psql -tAc "SELECT 1 FROM information_schema.tables WHERE table_name='user'" | grep -q 1; do
                attempt=$((attempt + 1))
                [ "$attempt" -ge "$max_attempts" ] && echo "gitea schema timeout" && exit 1
                echo "waiting for gitea schema..."; sleep 2
              done

              EXISTING=$(psql -tAc -v admin_username="$ADMIN_USERNAME" \
                -v admin_email="$ADMIN_EMAIL" \
                "SELECT COUNT(*) FROM \"user\"
                 WHERE lower_name = lower(:'admin_username')
                    OR lower(email) = lower(:'admin_email')")
              if [ "$EXISTING" -gt 0 ]; then
                echo "user $ADMIN_USERNAME or email $ADMIN_EMAIL already exists, skipping"
                exit 0
              fi

              SALT=$(head -c 10 /dev/urandom | base64 | tr -d '/+=' | head -c 10)
              HASH=$(printf '%s' "$ADMIN_PASSWORD" \
                | argon2 "$SALT" -id -t 2 -m 16 -p 8 -l 50 | awk '/Hash:/ {print $2}')
              AVATAR=$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 64)

              psql \
                -v ON_ERROR_STOP=1 \
                -v admin_username="$ADMIN_USERNAME" \
                -v admin_email="$ADMIN_EMAIL" \
                -v hash="$HASH" \
                -v salt="$SALT" \
                -v avatar="$AVATAR" <<'SQL'
              INSERT INTO "user" (
                lower_name, name, full_name, email, passwd, passwd_hash_algo,
                type, salt, is_admin, is_active, must_change_password,
                created_unix, updated_unix, last_login_unix,
                email_notifications_preference, avatar, avatar_email
              ) VALUES (
                lower(:'admin_username'), :'admin_username', :'admin_username',
                :'admin_email', :'hash', 'argon2',
                0, :'salt', true, true, true,
                extract(epoch from now())::bigint, extract(epoch from now())::bigint, 0,
                'enabled', :'avatar', :'admin_email'
              );
              SQL

              echo "admin user $ADMIN_USERNAME created"
          env:
            - name: PGHOST
              value: postgres.example.com
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: copia
            - name: PGDATABASE
              value: copia
            - name: PGPASSWORD
              value: CHANGE_ME
            - name: PGSSLMODE
              value: prefer
            - name: ADMIN_USERNAME
              value: CHANGE_ME
            - name: ADMIN_EMAIL
              value: CHANGE_ME@example.com
            - name: ADMIN_PASSWORD
              value: CHANGE_ME
